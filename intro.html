<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida</title>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    <style>
        /* ESTILOS COMPARTIDOS RESPONSIVE */
        :root { --color-pastel-yellow: #fdfd96; --color-pastel-pink: #ff8fa3; --color-bg-pink: #ffe6eb; --color-text: #d87093; }
        
        body { 
            margin: 0; 
            padding: 20px; 
            background-color: var(--color-bg-pink); 
            font-family: 'Chewy', cursive; 
            /* CORRECCIÓN: Permitir scroll vertical si no cabe */
            overflow-x: hidden;
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            position: relative; 
            text-align: center; 
        }
        
        /* TEXTO GIGANTE Y BONITO RESPONSIVE */
        h1 { 
            /* Clamp adapta el texto al tamaño de pantalla */
            font-size: clamp(2rem, 8vw, 3.5rem); 
            color: var(--color-text); 
            margin-bottom: 20px; 
            text-shadow: 2px 2px 0 white; 
            width: 100%;
            max-width: 800px;
        }
        
        /* GIF RESPONSIVE */
        .gif-container { 
            width: 100%;
            max-width: 250px; /* Limite en PC */
            height: auto; 
            border: 5px solid white; 
            border-radius: 20px; 
            margin-bottom: 30px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
        }
        
        /* BOTÓN RESPONSIVE */
        .btn { 
            background-color: var(--color-pastel-pink); 
            color: white; 
            font-family: 'Chewy', cursive; 
            font-size: clamp(1.5rem, 5vw, 2rem); 
            padding: 15px 40px; 
            border: 4px solid white; 
            border-radius: 50px; 
            cursor: pointer; 
            text-decoration: none; 
            display: inline-block; 
            transition: transform 0.2s; 
            box-shadow: 0 8px 0 #e07a8c; 
        }
        .btn:hover { transform: scale(1.05); }
        .btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #e07a8c; }

        /* FONDO DE ESTRELLAS FIXED */
        #stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .star { position: absolute; top: -50px; background: white; border-radius: 50%; box-shadow: 0 0 10px var(--color-pastel-yellow); opacity: 0.8; animation: fallDown linear forwards, sway ease-in-out infinite alternate; }
        @keyframes fallDown { to { top: 110vh; opacity: 0; } }
        @keyframes sway { from { transform: translateX(-30px); } to { transform: translateX(30px); } }
    </style>
</head>
<body>
    <audio id="bg-music" loop autoplay> <source src="musica.mp3" type="audio/mpeg"> </audio>
    <div id="stars-container"></div>

    <h1>Hola mi amor 😏<br>bienvenida a tu pedida de san valentin &lt;3</h1>
    
    <img src="intro.gif" class="gif-container" alt="Gif bienvenida">
    
    <br>
    <a href="plantilla_escaner1.html" class="btn">¡Estoy lista!</a>

    <script>
        // Lógica de estrellas y música
        const starsContainer = document.getElementById('stars-container');
        setInterval(() => {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.left = Math.random() * 100 + 'vw';
            star.style.width = Math.random() * 15 + 5 + 'px';
            star.style.height = star.style.width;
            star.style.animationDuration = (Math.random() * 5 + 3) + 's, ' + (Math.random() * 2 + 2) + 's';
            starsContainer.appendChild(star);
            setTimeout(() => star.remove(), 8000);
        }, 200);
        
        // Intento de autoplay de música
        document.body.addEventListener('click', () => { document.getElementById('bg-music').play(); }, { once: true });
    </script>
</body>
</html>
